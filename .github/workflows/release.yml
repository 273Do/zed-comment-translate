# Builds the server for each platform and attaches it to the GitHub release.
# The extension downloads `comment-translate-server-<target>.<tar.gz|zip>` from the latest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p comment-translate-server --target ${{ matrix.target }}
      - name: Package
        run: |
          dir=target/${{ matrix.target }}/release
          name=comment-translate-server-${{ matrix.target }}
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$name.zip" "./$dir/comment-translate-server.exe"
          else
            tar -czf "$name.tar.gz" -C "$dir" comment-translate-server
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: comment-translate-server-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" comment-translate-server-* --repo "${{ github.repository }}" --generate-notes
